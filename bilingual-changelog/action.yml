name: '双语变更日志生成器 / Bilingual Changelog Generator'
description: '自动提取两个 release 之间的变更记录并翻译成双语 / Automatically extract changes between releases and translate to bilingual format'
author: 'Desmond Dong'

branding:
  icon: 'file-text'
  color: 'blue'

inputs:
  llm-api-key:
    description: 'LLM API Key / LLM API Key'
    required: true
  llm-api-url:
    description: 'LLM Chat Completions API 地址 / LLM Chat Completions API URL'
    required: false
    default: 'https://open.bigmodel.cn/api/paas/v4/chat/completions'
  llm-model:
    description: 'LLM 模型名称 / LLM model name'
    required: false
    default: 'glm-4.7-flash'

outputs:
  changelog:
    description: '生成的双语 changelog / Generated bilingual changelog'
    value: ${{ steps.generate.outputs.changelog }}

runs:
  using: 'composite'
  steps:
    - name: 生成双语变更日志 / Generate bilingual changelog
      id: generate
      shell: bash
      env:
        INPUT_LLM_API_KEY: ${{ inputs.llm-api-key }}
        INPUT_LLM_API_URL: ${{ inputs.llm-api-url }}
        INPUT_LLM_MODEL: ${{ inputs.llm-model }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        # 获取上一个标签 / Get previous tag
        git fetch --tags 2>/dev/null || true
        prev_tag=$(git tag --sort=-creatordate | head -n 1)
        
        repo="${GITHUB_REPOSITORY}"
        head_sha="${GITHUB_SHA}"
        log=""
        
        # 通过 GitHub API 获取提交，author.login 由 GitHub 解析（含私有已验证邮箱）
        # Fetch commits via GitHub API; author.login resolves via all verified emails
        if [ -n "$prev_tag" ]; then
          echo "📌 从标签 $prev_tag 到 HEAD / From tag $prev_tag to HEAD"
          log=$(gh api "repos/$repo/compare/$prev_tag...$head_sha" --paginate 2>/dev/null \
            | jq -r '
                .commits[]? |
                "- \(.commit.message | split("\n")[0])" +
                (if .author.login then " (@\(.author.login))" else "" end)
              ' 2>/dev/null || true)
        else
          echo "⚠️  未找到标签，使用最近的提交 / No tags found, using recent commits"
          log=$(gh api "repos/$repo/commits?per_page=100" --paginate 2>/dev/null \
            | jq -r '
                .[]? |
                "- \(.commit.message | split("\n")[0])" +
                (if .author.login then " (@\(.author.login))" else "" end)
              ' 2>/dev/null || true)
        fi
        
        if [ -z "$log" ]; then
          echo "⚠️  未找到提交 / No commits found"
          echo "changelog=未找到变更 / No changes found" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        # 使用 AI 翻译 / Translate with AI
        echo "🤖 使用 AI 翻译中... / Translating with AI..."

        api_url="${INPUT_LLM_API_URL%/}"
        if [ -z "$api_url" ]; then
          echo "⚠️  API 地址为空，使用默认接口 / API URL is empty, using default endpoint"
          api_url="https://open.bigmodel.cn/api/paas/v4/chat/completions"
        fi

        prompt="请将以下 git commit 记录按类型分组整理成中英双语 changelog。如果原文是中文就翻译成英文，如果是英文就翻译成中文。务必保留每条 commit 开头的类型前缀，不允许省略，例如 fix:、docs:、chore:、refactor:、feat: 等；前缀可以翻译，但必须明确保留在中文和英文版本里。按类型前缀（如 feat / fix / docs / refactor / chore 等）分类分组，每组内先输出全部英文，再输出全部中文。不要中英文穿插。格式如下：

        English

        Features
        - Feat: add user management
        - Feat: improve performance

        Bug Fixes
        - Fix: login issue
        - Fix: fix crash on startup

        Chinese

        功能
        - 新增: 用户管理
        - 优化: 性能提升

        Bug 修复
        - 修复: 登录问题
        - 修复: 修复启动崩溃

        @用户名（如 @username）请用加粗（**@用户名**）醒目标示。只输出整理后的结果，不要其他内容。

        ${log}"
        
        response=$(curl -s "$api_url" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer $INPUT_LLM_API_KEY" \
          -d "$(jq -n \
            --arg content "$prompt" \
            --arg model "$INPUT_LLM_MODEL" \
            '{
              "model": $model,
              "messages": [{"role": "user", "content": $content}],
              "temperature": 0.1
            }')")
        
        translated=$(echo "$response" | jq -r '.choices[0].message.content // empty')
        
        if [ -n "$translated" ]; then
          log="$translated"
          echo "✅ 翻译完成 / Translation completed"
        else
          echo "⚠️  翻译失败，使用原始日志 / Translation failed, using original log"
          error=$(echo "$response" | jq -r '.error.message // "Unknown error"')
          echo "错误 / Error: $error"
        fi
        
        # 输出结果 / Output results
        {
          echo "changelog<<EOF"
          echo "$log"
          echo "EOF"
        } >> $GITHUB_OUTPUT
        
        echo "✨ 变更日志生成成功 / Changelog generated successfully"
